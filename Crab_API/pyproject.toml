[project]
name = "crab-api"
version = "0.1.1"
description = "Crab API — host-side controller that talks to Urchin firmware over USB serial"
requires-python = ">=3.8"
dependencies = [
    "tomlkit",
    "tomlkit-extras",
    "pyserial",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The modules use flat imports (e.g. `from ESPSerial import *`), so they are
# installed as top-level modules rather than under a package namespace.
[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = [
    "src/Bridge.py",
    "src/Crab.py",
    "src/ESPSerial.py",
    "src/HerkuleX.py",
    "src/Reaction.py",
    "src/Types.py",
]

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml"]
