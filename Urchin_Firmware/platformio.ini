; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html



[env:common]
platform = espressif32
board = esp32dev
framework = espidf
build_type = debug
debug_tool = esp-prog
debug_init_break = tbreak setup
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -DLOG_LOCAL_LEVEL=ESP_LOG_NONE
    -DDEBUG
    -Wall                ; Enable all common warnings
    -Werror              ; Treat warnings as errors
    -Wreturn-type        ; Warn if return type is missing in non-void functions
    -Wextra
    -std=c++17

    -I src/Global
    -I src/Tickets
    -I src/ESP_PI_Communication
    -I src/NotStarted

CONFIG_FREERTOS_USE_HEAP_4=y

; D-BOX-vendored uses C++ exceptions (disabled by default in ESP-IDF builds)
; and is only actually needed by env:DBoxEcho, which re-enables both below.
; PlatformIO auto-links everything under lib/ into every environment
; otherwise, so leaving this out would break every other build.
lib_ignore = D-BOX-vendored

[env:Urchin-Firmware]
extends = env:common




[env:UnitTest]
extends = env:common
build_flags = ${env:common.build_flags} -DUNIT_TEST -I src/test

; Local-only, not committed to Dev: isolated hardware-verification build.
; Builds only src/DBoxEcho (see src/CMakeLists.txt) against a vendored,
; unmodified copy of Gabe's D-BOX protocol in lib/D-BOX-vendored.
[env:DBoxEcho]
extends = env:common
lib_ignore =
build_flags =
    -DLOG_LOCAL_LEVEL=ESP_LOG_NONE
    -Wall
    -Wextra
    -std=gnu++20
    -fexceptions

; Local-only, not committed to Dev: isolated hardware-verification build.
; Builds only src/HerkulexTest (see src/CMakeLists.txt) plus the existing,
; unmodified src/Herkulex driver -- exercises real servo motion over UART
; without booting the rest of the Urchin app (Bridge/Ticketing/Ordering).
; Run with: $env:HERKULEX_TEST_ONLY=1; pio run -e HerkulexTest -t upload -t monitor
[env:HerkulexTest]
extends = env:common
