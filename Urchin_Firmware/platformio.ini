; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html



[env:common]
platform = espressif32
board = esp32dev
framework = espidf
build_type = debug
debug_tool = esp-prog
debug_init_break = tbreak setup
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -DLOG_LOCAL_LEVEL=ESP_LOG_NONE
    -DDEBUG
    -Wall                ; Enable all common warnings
    -Werror              ; Treat warnings as errors
    -Wreturn-type        ; Warn if return type is missing in non-void functions
    -Wextra
    -std=c++17

    -I src/Global
    -I src/Tickets
    -I src/ESP_PI_Communication
    -I src/NotStarted

CONFIG_FREERTOS_USE_HEAP_4=y

; D-BOX-vendored uses C++ exceptions (disabled by default in ESP-IDF builds)
; and is only actually needed by env:DBoxEcho/env:DBoxMotor, which
; re-enable both below. PlatformIO auto-links everything under lib/ into
; every environment otherwise, so leaving this out would break every other
; build.
lib_ignore = D-BOX-vendored

; Picks which sources src/CMakeLists.txt builds for each environment (the
; normal app vs. one of the bench tests) -- see the script for why this
; isn't left to hand-set environment variables.
extra_scripts = pre:scripts/select_sources.py

[env:Urchin-Firmware]
extends = env:common




[env:UnitTest]
extends = env:common
build_flags = ${env:common.build_flags} -DUNIT_TEST -I src/test

; Local-only, not committed to Dev: isolated hardware-verification build.
; Builds only src/DBoxEcho (see src/CMakeLists.txt) against a vendored,
; unmodified copy of Gabe's D-BOX protocol in lib/D-BOX-vendored.
; sdkconfig.DBoxEcho enables CONFIG_COMPILER_CXX_EXCEPTIONS: D-BOX's
; receive() throws and catches RingBufferUnderflowException whenever a
; frame is only partly received, and with exceptions disabled in sdkconfig
; ESP-IDF turns every throw into abort() (-fexceptions alone isn't enough).
[env:DBoxEcho]
extends = env:common
lib_ignore =
build_flags =
    -DLOG_LOCAL_LEVEL=ESP_LOG_NONE
    -Wall
    -Wextra
    -std=gnu++20
    -fexceptions

; Local-only, not committed to Dev: isolated hardware-verification build.
; Builds only src/HerkulexTest (see src/CMakeLists.txt) plus the existing,
; unmodified src/Herkulex driver -- exercises real servo motion over UART
; without booting the rest of the Urchin app (Bridge/Ticketing/Ordering).
; Setup guide for the whole bench (wiring, power order, controls):
; src/HerkulexTest/README.md
; Run with: pio run -e HerkulexTest -t upload   (then)   pio device monitor
[env:HerkulexTest]
extends = env:common

; Local-only bench test: laptop --D-BOX--> ESP32 --Herkulex--> servo.
; Combines DBoxEcho's D-BOX transport with HerkulexTest's servo helpers
; (src/BenchShared). Same exception requirements as env:DBoxEcho (see
; sdkconfig.DBoxMotor). Driven from the laptop by
; Crab_API/src/bench_test.py -- guide: Crab_API/BENCH_TEST.md
; Run with: pio run -e DBoxMotor -t upload
[env:DBoxMotor]
extends = env:common
lib_ignore =
build_flags =
    -DLOG_LOCAL_LEVEL=ESP_LOG_NONE
    -Wall
    -Wextra
    -std=gnu++20
    -fexceptions
